name: AI Agent Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Qwen Code
        run: |
          npm install -g @qwen-code/qwen-code@latest
          qwen --version

      - name: Get Open SonarQube Code Smells
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -sS \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            -H "Accept: application/json" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=mythrion&statuses=OPEN&types=CODE_SMELL" \
            > sonar-issues.json

          echo "===== SONARQUBE ISSUES ====="
          jq . sonar-issues.json
          echo "============================"

      - name: Test Qwen + OpenRouter
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: openrouter/free
        run: |
          qwen \
            --prompt "Read the file sonar-issues.json. Report the total number of open Code Smells. For each issue, report the file, line, rule, severity, and message. Do NOT modify any files. Do NOT execute commands that modify the repository. Return a concise technical report." \
            --output-format text