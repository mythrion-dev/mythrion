name: AI Agent Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Qwen Code
        run: |
          npm install -g @qwen-code/qwen-code@latest
          qwen --version

      - name: Test Qwen + OpenRouter
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: openrouter/free
        run: |
          set -x

          qwen \
            --prompt "Reply with exactly: QWEN_OPENROUTER_OK" \
            --output-format text

      - name: Test SonarQube API
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Sonar URL: ${SONAR_HOST_URL}"

          HTTP_CODE=$(curl -sS \
            -o sonar-response.txt \
            -w "%{http_code}" \
            -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=mythrion&resolved=false")

          echo "HTTP Status: ${HTTP_CODE}"

          echo "===== RESPONSE ====="
          cat sonar-response.txt
          echo
          echo "===================="

          if [ "${HTTP_CODE}" -ge 400 ]; then
            echo "SonarQube API request failed"
            exit 1
          fi    