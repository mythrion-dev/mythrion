name: AI Agent Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Qwen Code
        run: |
          npm install -g @qwen-code/qwen-code@latest
          qwen --version

      # - name: Test Qwen + OpenRouter
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      #     OPENAI_BASE_URL: https://openrouter.ai/api/v1
      #     OPENAI_MODEL: openrouter/free
      #   run: |
      #     set -x

      #     qwen \
      #       --prompt "Reply with exactly: QWEN_OPENROUTER_OK" \
      #       --output-format text

      - name: Validate SONAR_HOST_URL
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [[ "$SONAR_HOST_URL" == "https://sonarqube-qa.up.railway.app" ]]; then
            echo "SONAR_HOST_URL is correct"
          else
            echo "SONAR_HOST_URL is NOT the expected value"
            exit 1
          fi