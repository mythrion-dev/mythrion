name: SonarQube QA Diagnostic

on:
  push:
    branches:
      - qa

permissions:
  contents: read

jobs:
  sonar-diagnostic:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT QA
      # ============================================================
      - name: Checkout QA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: qa

      # ============================================================
      # SHOW GIT INFORMATION
      # ============================================================
      - name: Show Git information
        run: |
          echo "===== BRANCH ====="
          git branch --show-current

          echo ""
          echo "===== COMMIT ====="
          git rev-parse HEAD

          echo ""
          echo "===== GITHUB REF ====="
          echo "${GITHUB_REF}"

          echo ""
          echo "===== GITHUB SHA ====="
          echo "${GITHUB_SHA}"

      # ============================================================
      # NODE
      # ============================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ============================================================
      # SERVER DEPENDENCIES
      # ============================================================
      - name: Install server dependencies
        run: |
          cd server
          npm ci

      # ============================================================
      # CLIENT DEPENDENCIES
      # ============================================================
      - name: Install client dependencies
        run: |
          cd client
          npm ci

      # ============================================================
      # SERVER TESTS
      # ============================================================
      - name: Run server tests
        run: |
          cd server
          npm run test:cov

      # ============================================================
      # CLIENT TESTS
      # ============================================================
      - name: Run client tests
        run: |
          cd client
          npm run test:cov

      # ============================================================
      # SONARQUBE
      # ============================================================
      - name: Run SonarQube Analysis
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ============================================================
      # SHOW SONAR REPORT
      # ============================================================
      - name: Inspect SonarQube report
        run: |
          echo "=========================================="
          echo "SONARQUBE REPORT TASK"
          echo "=========================================="

          if [[ -f ".scannerwork/report-task.txt" ]]; then
            cat .scannerwork/report-task.txt
          else
            echo "report-task.txt NOT FOUND"
          fi

          echo ""
          echo "=========================================="
          echo "SONARQUBE WORK DIRECTORY"
          echo "=========================================="

          find .scannerwork -maxdepth 2 -type f -print 2>/dev/null || true

      # ============================================================
      # SONARQUBE SYSTEM STATUS
      # ============================================================
      - name: Check SonarQube status
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SONARQUBE STATUS"
          echo "=========================================="

          curl -sS \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            -H "Accept: application/json" \
            "${SONAR_HOST_URL}/api/system/status" \
            | jq .

      # ============================================================
      # LIST PROJECT BRANCHES
      # ============================================================
      - name: List SonarQube project branches
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SONARQUBE PROJECT BRANCHES"
          echo "=========================================="

          curl -sS \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            -H "Accept: application/json" \
            "${SONAR_HOST_URL}/api/project_branches/list?project=mythrion" \
            | jq .

      # ============================================================
      # LIST ALL ISSUES
      # ============================================================
      - name: List all SonarQube issues
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ALL SONARQUBE ISSUES"
          echo "=========================================="

          curl -sS \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            -H "Accept: application/json" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=mythrion&ps=100" \
            | jq .

      # ============================================================
      # LIST OPEN ISSUES
      # ============================================================
      - name: List open SonarQube issues
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "OPEN SONARQUBE ISSUES"
          echo "=========================================="

          curl -sS \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            -H "Accept: application/json" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=mythrion&statuses=OPEN&ps=100" \
            | jq .