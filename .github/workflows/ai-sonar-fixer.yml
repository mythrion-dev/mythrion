name: AI SonarQube Fix - QA

on:
  push:
    branches:
      - qa

permissions:
  contents: write

jobs:
  sonar-ai-fix:
    # Evita que o commit feito pelo próprio agente dispare outro ciclo.
    # O workflow só trabalha quando o push veio de uma alteração normal.
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT QA
      # ============================================================
      - name: Checkout QA
        uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      # ============================================================
      # SHOW GIT INFORMATION
      # ============================================================
      - name: Show Git information
        run: |
          echo "=========================================="
          echo "GIT INFORMATION"
          echo "=========================================="

          echo "Branch:"
          git branch --show-current

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "GitHub ref:"
          echo "${GITHUB_REF}"

          echo ""
          echo "GitHub SHA:"
          echo "${GITHUB_SHA}"

      # ============================================================
      # NODE
      # ============================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ============================================================
      # INSTALL SERVER
      # ============================================================
      - name: Install server dependencies
        run: |
          cd server
          npm ci

      # ============================================================
      # INSTALL CLIENT
      # ============================================================
      - name: Install client dependencies
        run: |
          cd client
          npm ci

      # ============================================================
      # SERVER TESTS
      # ============================================================
      - name: Run server tests
        run: |
          cd server
          npm run test:cov

      # ============================================================
      # CLIENT TESTS
      # ============================================================
      - name: Run client tests
        run: |
          cd client
          npm run test:cov

      # ============================================================
      # RUN SONARQUBE ANALYSIS
      # ============================================================
      - name: Run SonarQube Analysis
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ============================================================
      # SHOW SONAR TASK
      # ============================================================
      - name: Show SonarQube task
        run: |
          echo "=========================================="
          echo "SONARQUBE TASK"
          echo "=========================================="

          if [[ ! -f ".scannerwork/report-task.txt" ]]; then
            echo "ERROR: report-task.txt was not generated."
            exit 1
          fi

          cat .scannerwork/report-task.txt

      # ============================================================
      # WAIT FOR SONARQUBE ANALYSIS
      # ============================================================
      - name: Wait for SonarQube analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "WAITING FOR SONARQUBE ANALYSIS"
          echo "=========================================="

          CE_TASK_ID=$(grep '^ceTaskId=' .scannerwork/report-task.txt | cut -d'=' -f2)

          if [[ -z "$CE_TASK_ID" ]]; then
            echo "ERROR: Could not find ceTaskId."
            exit 1
          fi

          echo "CE Task ID: $CE_TASK_ID"

          for i in {1..30}; do

            RESPONSE=$(curl -sS \
              -H "Authorization: Bearer ${SONAR_TOKEN}" \
              -H "Accept: application/json" \
              "${SONAR_HOST_URL}/api/ce/task?id=${CE_TASK_ID}")

            STATUS=$(echo "$RESPONSE" | jq -r '.task.status // empty')

            echo "Attempt $i/30 - SonarQube task status: ${STATUS}"

            case "$STATUS" in
              SUCCESS)
                echo "SonarQube analysis completed successfully."
                exit 0
                ;;

              FAILED)
                echo "SonarQube analysis FAILED."
                echo "$RESPONSE" | jq .
                exit 1
                ;;

              CANCELED)
                echo "SonarQube analysis was CANCELED."
                echo "$RESPONSE" | jq .
                exit 1
                ;;

              PENDING|IN_PROGRESS)
                echo "Analysis still running..."
                sleep 10
                ;;

              *)
                echo "Unknown SonarQube status."
                echo "$RESPONSE" | jq .
                sleep 10
                ;;
            esac

          done

          echo "SonarQube analysis did not finish within the expected time."
          exit 1

      # ============================================================
      # GET OPEN CODE SMELLS
      # ============================================================
      - name: Get OPEN SonarQube Code Smells
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "GETTING OPEN SONARQUBE CODE SMELLS"
          echo "=========================================="

          SONAR_URL="${SONAR_HOST_URL}/api/issues/search?componentKeys=mythrion&statuses=OPEN&types=CODE_SMELL&ps=500"

          echo "Query:"
          echo "${SONAR_URL}"

          curl -sS \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            -H "Accept: application/json" \
            "$SONAR_URL" \
            > sonar-response.json

          echo ""
          echo "===== SONARQUBE RESPONSE ====="
          jq . sonar-response.json
          echo "=============================="

          # Validate JSON
          jq empty sonar-response.json

          # Make absolutely sure every returned issue is OPEN.
          jq '
            {
              total: (
                .issues
                | map(select(.status == "OPEN"))
                | length
              ),
              issues: (
                .issues
                | map(select(.status == "OPEN"))
              )
            }
          ' sonar-response.json > sonar-issues.json

          TOTAL_OPEN=$(jq -r '.total' sonar-issues.json)

          echo ""
          echo "=========================================="
          echo "OPEN CODE SMELLS: ${TOTAL_OPEN}"
          echo "=========================================="

          jq . sonar-issues.json

          if [[ "$TOTAL_OPEN" -eq 0 ]]; then
            echo ""
            echo "No OPEN Code Smells found."
          else
            echo ""
            echo "OPEN Code Smells found."
          fi

      # ============================================================
      # INSTALL QWEN
      # ============================================================
      - name: Install Qwen Code
        if: ${{ hashFiles('sonar-issues.json') != '' }}
        run: |
          npm install -g @qwen-code/qwen-code@latest
          qwen --version

      # ============================================================
      # RUN QWEN
      # ============================================================
      - name: Run Qwen Code Fixer
        if: ${{ hashFiles('sonar-issues.json') != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: openai/gpt-oss-120b
        run: |
          set -euo pipefail

          TOTAL_OPEN=$(jq -r '.total' sonar-issues.json)

          echo "=========================================="
          echo "QWEN"
          echo "=========================================="

          echo "Open Code Smells: ${TOTAL_OPEN}"

          if [[ "$TOTAL_OPEN" -eq 0 ]]; then
            echo "Nothing for Qwen to fix."
            exit 0
          fi

          echo ""
          echo "Starting Qwen..."

          qwen \
            --prompt "
          You are an autonomous senior TypeScript/React/NestJS developer.

          You are working directly on the QA branch of this repository.

          Your task is to fix the OPEN SonarQube Code Smells listed in:

          sonar-issues.json

          IMPORTANT RULES:

          1. Read sonar-issues.json FIRST.

          2. ONLY fix issues whose status is OPEN.

          3. NEVER modify issues that are:
             - CLOSED
             - RESOLVED
             - ACCEPTED
             - WONTFIX
             - FIXED

          4. Do NOT modify code unrelated to the reported issues.

          5. Preserve existing application behavior.

          6. Prefer the smallest clean and maintainable solution.

          7. Follow the existing project's coding conventions.

          8. Do NOT disable SonarQube rules.

          9. Do NOT add SonarQube suppressions.

          10. Do NOT modify sonar-project.properties.

          11. Do NOT modify GitHub Actions workflows.

          12. Do NOT modify package.json unless absolutely necessary.

          13. Do NOT modify package-lock.json.

          14. Do NOT remove tests.

          15. Do NOT reduce test coverage.

          16. Do NOT create commits.

          17. Do NOT push anything.

          18. Do NOT modify the main branch.

          Before making changes:

          - Read sonar-issues.json.
          - Inspect every affected source file.
          - Understand the surrounding code.
          - Determine the correct minimal fix.

          Then:

          - Fix the reported OPEN Code Smells.
          - Run relevant tests.
          - Run lint/typecheck where appropriate.
          - Fix any regression caused by your changes.

          At the end provide:

          - Issues fixed
          - Files modified
          - Tests executed
          - Remaining concerns
          " \
            --output-format text

      # ============================================================
      # SHOW CHANGES
      # ============================================================
      - name: Show Changes
        run: |
          echo "=========================================="
          echo "GIT STATUS"
          echo "=========================================="

          git status --short

          echo ""
          echo "=========================================="
          echo "DIFF STAT"
          echo "=========================================="

          git diff --stat

          echo ""
          echo "=========================================="
          echo "DIFF"
          echo "=========================================="

          git diff

      # ============================================================
      # COMMIT AI FIXES TO QA
      # ============================================================
      - name: Commit AI fixes to QA
        run: |
          set -euo pipefail

          # Temporary Sonar files must never be committed.
          rm -f sonar-response.json
          rm -f sonar-issues.json

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "=========================================="
            echo "NO SOURCE CODE CHANGES"
            echo "=========================================="
            exit 0
          fi

          echo "=========================================="
          echo "COMMITTING AI FIXES TO QA"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit \
            -m "fix: resolve SonarQube issues with AI"

          git push origin HEAD:qa

          echo ""
          echo "AI fixes pushed to QA."