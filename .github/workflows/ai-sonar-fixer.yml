name: SonarQube QA Diagnostic

on:
  push:
    branches:
      - qa

permissions:
  contents: read

jobs:
  sonar-diagnostic:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT QA
      # ============================================================
      - name: Checkout QA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: qa

      # ============================================================
      # NODE
      # ============================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ============================================================
      # SERVER DEPENDENCIES
      # ============================================================
      - name: Install server dependencies
        run: |
          cd server
          npm ci

      # ============================================================
      # CLIENT DEPENDENCIES
      # ============================================================
      - name: Install client dependencies
        run: |
          cd client
          npm ci

      # ============================================================
      # SERVER TESTS
      # ============================================================
      - name: Run server tests
        run: |
          cd server
          npm run test:cov

      # ============================================================
      # CLIENT TESTS
      # ============================================================
      - name: Run client tests
        run: |
          cd client
          npm run test:cov

      # ============================================================
      # SONARQUBE ANALYSIS
      # ============================================================
      - name: Run SonarQube Analysis
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ============================================================
      # WAIT FOR SONARQUBE
      # ============================================================
      - name: Wait for SonarQube
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking SonarQube"
          echo "=========================================="

          for i in {1..30}; do

            RESPONSE=$(curl -sS \
              -H "Authorization: Bearer ${SONAR_TOKEN}" \
              -H "Accept: application/json" \
              "${SONAR_HOST_URL}/api/system/status")

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Attempt $i - SonarQube status: $STATUS"

            if [[ "$STATUS" == "UP" ]]; then
              echo "SonarQube is UP."
              break
            fi

            if [[ "$i" == "30" ]]; then
              echo "SonarQube did not become available."
              exit 1
            fi

            sleep 5
          done

      # ============================================================
      # QUERY SONARQUBE
      # ============================================================
      - name: Compare SonarQube branches
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo "SONARQUBE DIAGNOSTIC"
          echo "=========================================="

          echo ""
          echo "=========================================="
          echo "QUERY 1 - QA BRANCH"
          echo "=========================================="

          QA_RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            -H "Accept: application/json" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=mythrion&branch=qa&statuses=OPEN&types=CODE_SMELL&ps=100")

          echo "$QA_RESPONSE" | jq .

          QA_TOTAL=$(echo "$QA_RESPONSE" | jq -r '.total // 0')

          echo ""
          echo "Open Code Smells on branch QA: $QA_TOTAL"

          echo ""
          echo "=========================================="
          echo "QUERY 2 - PROJECT WITHOUT BRANCH FILTER"
          echo "=========================================="

          ALL_RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            -H "Accept: application/json" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=mythrion&statuses=OPEN&types=CODE_SMELL&ps=100")

          echo "$ALL_RESPONSE" | jq .

          ALL_TOTAL=$(echo "$ALL_RESPONSE" | jq -r '.total // 0')

          echo ""
          echo "Open Code Smells without branch filter: $ALL_TOTAL"

          echo ""
          echo "=========================================="
          echo "RESULT"
          echo "=========================================="

          echo "QA branch:        $QA_TOTAL"
          echo "Without branch:   $ALL_TOTAL"

          if [[ "$QA_TOTAL" == "0" && "$ALL_TOTAL" != "0" ]]; then
            echo ""
            echo "IMPORTANT:"
            echo "SonarQube has open issues, but they are not associated"
            echo "with the QA branch."
          fi

          echo ""
          echo "Diagnostic finished."