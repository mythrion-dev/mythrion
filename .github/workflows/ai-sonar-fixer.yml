name: SonarQube AI Fixer - QA

on:
  push:
    branches:
      - qa

permissions:
  contents: write

jobs:
  sonar-ai-fixer:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT QA
      # ============================================================
      - name: Checkout QA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: qa

      # ============================================================
      # NODE
      # ============================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # INSTALL SERVER
      # ============================================================
      - name: Install server dependencies
        run: |
          cd server
          npm ci

      # ============================================================
      # INSTALL CLIENT
      # ============================================================
      - name: Install client dependencies
        run: |
          cd client
          npm ci

      # ============================================================
      # SERVER TESTS
      # ============================================================
      - name: Run server tests
        run: |
          cd server
          npm run test:cov

      # ============================================================
      # CLIENT TESTS
      # ============================================================
      - name: Run client tests
        run: |
          cd client
          npm run test:cov

      # ============================================================
      # SONARQUBE ANALYSIS
      # ============================================================
      - name: Run SonarQube Analysis
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ============================================================
      # WAIT FOR SONARQUBE
      # ============================================================
      - name: Wait for SonarQube
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          echo "Checking SonarQube..."

          for i in {1..30}; do

            RESPONSE=$(curl -sS \
              -H "Authorization: Bearer ${SONAR_TOKEN}" \
              -H "Accept: application/json" \
              "${SONAR_HOST_URL}/api/system/status")

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "SonarQube status: $STATUS"

            if [[ "$STATUS" == "UP" ]]; then
              break
            fi

            if [[ "$i" == "30" ]]; then
              echo "SonarQube did not become available."
              exit 1
            fi

            sleep 5
          done

      # ============================================================
      # GET OPEN CODE SMELLS FROM QA
      # ============================================================
      - name: Get SonarQube Open Code Smells
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking SonarQube issues on QA"
          echo "=========================================="

          curl -sS \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            -H "Accept: application/json" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=mythrion&branch=qa&statuses=OPEN&types=CODE_SMELL&ps=100" \
            > sonar-issues.json

          echo ""
          echo "===== SONARQUBE RESPONSE ====="
          jq . sonar-issues.json
          echo "=============================="

          if jq -e '.errors' sonar-issues.json > /dev/null; then
            echo ""
            echo "SonarQube API returned an error:"
            jq '.errors' sonar-issues.json
            exit 1
          fi

          TOTAL=$(jq -r '.total // 0' sonar-issues.json)

          echo ""
          echo "Open SonarQube Code Smells on QA: $TOTAL"

      # ============================================================
      # INSTALL QWEN
      # ============================================================
      - name: Install Qwen Code
        run: |
          npm install -g @qwen-code/qwen-code@latest
          qwen --version

      # ============================================================
      # RUN QWEN
      # ============================================================
      - name: Fix SonarQube issues with Qwen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: openai/gpt-oss-120b
        run: |
          set -euo pipefail

          TOTAL=$(jq -r '.total // 0' sonar-issues.json)

          echo "=========================================="
          echo "Open Code Smells: $TOTAL"
          echo "=========================================="

          if [[ "$TOTAL" == "0" ]]; then
            echo "No open Code Smells found."
            exit 0
          fi

          qwen \
            --prompt "
          You are an autonomous senior TypeScript, React, Next.js and NestJS developer.

          Your task is to fix the OPEN SonarQube Code Smells in this repository.

          The SonarQube report is located at:

          sonar-issues.json

          IMPORTANT RULES:

          1. Read sonar-issues.json first.
          2. Only fix issues whose status is OPEN.
          3. Only fix issues present in sonar-issues.json.
          4. Do NOT modify RESOLVED issues.
          5. Do NOT modify ACCEPTED issues.
          6. Do NOT modify WONTFIX issues.
          7. Do NOT disable SonarQube rules.
          8. Do NOT add SonarQube suppressions.
          9. Do NOT add eslint-disable comments just to hide problems.
          10. Do NOT modify sonar-project.properties.
          11. Do NOT modify GitHub Actions workflows.
          12. Do NOT modify package.json unless absolutely necessary.
          13. Do NOT modify package-lock.json.
          14. Do NOT remove tests.
          15. Do NOT reduce test coverage.
          16. Do NOT change application behavior unnecessarily.
          17. Prefer the smallest safe solution.
          18. Follow the existing project's coding style.
          19. Inspect the surrounding code before modifying anything.
          20. Do not blindly apply a SonarQube recommendation if it would make the code worse.

          For every issue:

          - Identify the affected file.
          - Identify the affected line.
          - Understand the SonarQube rule.
          - Inspect the surrounding implementation.
          - Apply the appropriate fix.
          - Preserve existing functionality.

          After making changes:

          - Run the relevant tests.
          - Run lint where appropriate.
          - Fix any regressions caused by your changes.

          At the end, provide a concise summary containing:

          - Issues fixed
          - Files modified
          - Tests executed
          - Remaining concerns

          You are allowed to modify source files.

          Do NOT create Git commits.
          Do NOT push anything.
          " \
            --output-format text

      # ============================================================
      # SHOW CHANGES
      # ============================================================
      - name: Show changes
        run: |
          echo "===== GIT STATUS ====="
          git status --short

          echo ""
          echo "===== DIFF STAT ====="
          git diff --stat

          echo ""
          echo "===== DIFF ====="
          git diff

      # ============================================================
      # COMMIT AI CHANGES TO QA
      # ============================================================
      - name: Commit AI fixes
        run: |
          set -euo pipefail

          # sonar-issues.json is only a temporary analysis artifact
          rm -f sonar-issues.json

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "fix: resolve SonarQube code smells"

          git push origin HEAD:qa