name: AI SonarQube Fixer - QA

on:
  push:
    branches:
      - qa

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-sonar-fixer-qa
  cancel-in-progress: false

jobs:
  fix-sonar-issues:
    name: Analyze and Fix SonarQube Issues
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout SOMENTE da QA
      # ============================================================
      - name: Checkout QA
        uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2. Setup Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ============================================================
      # 3. Instalar dependências
      # ============================================================
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      # ============================================================
      # 4. Consultar SonarQube
      # ============================================================
      - name: Get SonarQube Code Smells
        id: sonar
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          echo "Checking SonarQube..."

          SONAR_URL="${SONAR_HOST_URL}/api/issues/search?componentKeys=mythrion&statuses=OPEN&types=CODE_SMELL&ps=100"

          HTTP_STATUS=$(curl -sS \
            -o sonar-issues.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            -H "Accept: application/json" \
            "${SONAR_URL}")

          echo "HTTP Status: ${HTTP_STATUS}"

          if [[ "${HTTP_STATUS}" != "200" ]]; then
            echo "SonarQube API request failed."

            echo "===== SONARQUBE RESPONSE ====="
            cat sonar-issues.json
            echo "=============================="

            exit 1
          fi

          echo "===== SONARQUBE RESPONSE ====="
          jq . sonar-issues.json
          echo "=============================="

          if ! jq -e '.total' sonar-issues.json >/dev/null; then
            echo "Invalid SonarQube response."
            exit 1
          fi

          TOTAL=$(jq -r '.total' sonar-issues.json)

          echo "Open Code Smells: ${TOTAL}"

          echo "total=${TOTAL}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # 5. Se não houver issues, encerra
      # ============================================================
      - name: No Code Smells
        if: steps.sonar.outputs.total == '0'
        run: |
          echo "======================================"
          echo "No OPEN Code Smells found."
          echo "QA is clean from SonarQube Code Smells."
          echo "======================================"

      # ============================================================
      # 6. Instalar Qwen
      # ============================================================
      - name: Install Qwen Code
        if: steps.sonar.outputs.total != '0'
        run: |
          npm install -g @qwen-code/qwen-code@latest
          qwen --version

      # ============================================================
      # 7. Executar Qwen
      # ============================================================
      - name: Run Qwen SonarQube Fixer
        if: steps.sonar.outputs.total != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: openai/gpt-oss-120b
        run: |
          set -euo pipefail

          qwen \
            --prompt "
          You are an autonomous senior TypeScript/React/NestJS developer.

          You are working directly on the QA branch of the Mythrion
          repository.

          Your task is to fix the OPEN Code Smells reported by SonarQube.

          The SonarQube issues are available in:

          sonar-issues.json

          ============================================================
          FIRST: READ THE SONARQUBE REPORT
          ============================================================

          Read sonar-issues.json before making any modification.

          The report contains the current OPEN Code Smells detected
          by SonarQube.

          ============================================================
          RULES
          ============================================================

          1. Only fix issues whose status is OPEN.

          2. Only fix issues whose type is CODE_SMELL.

          3. Do NOT modify issues that are:
             - RESOLVED
             - ACCEPTED
             - WONTFIX
             - CLOSED

          4. Inspect the relevant source file before modifying it.

          5. Understand the context of the issue before applying a fix.

          6. Use the smallest clean solution possible.

          7. Preserve existing application behavior.

          8. Follow the existing project's coding style.

          9. Do NOT disable SonarQube rules.

          10. Do NOT add SonarQube suppressions just to make an issue
              disappear.

          11. Do NOT modify sonar-project.properties.

          12. Do NOT modify any GitHub Actions workflow.

          13. Do NOT modify package.json unless absolutely necessary.

          14. Do NOT modify package-lock.json.

          15. Do NOT remove tests.

          16. Do NOT reduce test coverage.

          17. Do NOT make unrelated refactoring.

          18. Do NOT change application behavior unnecessarily.

          19. Do NOT create commits.

          20. Do NOT push anything.

          ============================================================
          AFTER CHANGES
          ============================================================

          Run the relevant tests.

          Backend:

          cd server
          npm test -- --runInBand

          Frontend:

          cd client
          npm test -- --run

          Run lint where appropriate.

          If a test or lint fails because of your modification,
          fix the problem.

          Do not ignore test failures.

          ============================================================
          FINAL RESPONSE
          ============================================================

          Return a concise summary containing:

          - SonarQube issues identified
          - Issues fixed
          - Files modified
          - Tests executed
          - Lint executed
          - Any remaining concerns

          Remember:

          You are allowed to modify source files.

          You MUST NOT create commits.

          You MUST NOT push anything.

          The GitHub Actions workflow will handle the commit and push.
          " \
            --output-format text

      # ============================================================
      # 8. Mostrar alterações
      # ============================================================
      - name: Show Git Changes
        if: steps.sonar.outputs.total != '0'
        run: |
          echo "===== GIT STATUS ====="
          git status --short

          echo ""
          echo "===== DIFF STAT ====="
          git diff --stat

          echo ""
          echo "===== DIFF ====="
          git diff

      # ============================================================
      # 9. Verificar se o agente realmente alterou código
      # ============================================================
      - name: Check AI Changes
        if: steps.sonar.outputs.total != '0'
        id: changes
        run: |
          if git diff --quiet -- client server; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"

            echo "Qwen did not modify client or server."

          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"

            echo "Qwen modified the source code."
          fi

      # ============================================================
      # 10. Testes do backend
      # ============================================================
      - name: Run backend tests
        if: steps.changes.outputs.changed == 'true'
        working-directory: server
        run: npm test -- --runInBand

      # ============================================================
      # 11. Testes do frontend
      # ============================================================
      - name: Run frontend tests
        if: steps.changes.outputs.changed == 'true'
        working-directory: client
        run: npm test -- --run

      # ============================================================
      # 12. Commit SOMENTE client/server
      # ============================================================
      - name: Commit AI fixes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Mythrion AI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add client server

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "fix(ai): resolve SonarQube code smells"

      # ============================================================
      # 13. Push SOMENTE para QA
      # ============================================================
      - name: Push AI fixes to QA
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "Pushing AI fixes to QA..."

          git push origin HEAD:qa

          echo "AI fixes pushed successfully to QA."