# SonarQube project configuration
# Read by sonarqube-scan-action during CI

sonar.projectKey=mythrion
sonar.projectName=Mythrion

# Source directories
sonar.sources=client/src,server/src

# Exclusions (generated files, configs, etc.)
sonar.exclusions=**/node_modules/**,**/*.generated.*,**/generated/**

# Languages
sonar.language=ts

# JavaScript/TypeScript config
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info
sonar.typescript.tsconfigPath=client/tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

# Branches — analysis runs on qa branch via CI
sonar.branch.name=qa
