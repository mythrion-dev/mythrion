# SonarQube project configuration
# Read by sonarqube-scan-action during CI

sonar.projectKey=mythrion
sonar.projectName=Mythrion

# Source directories
sonar.sources=client,server/src

# Exclusions (generated files, configs, coverage reports, etc.)
sonar.exclusions=**/node_modules/**,**/*.generated.*,**/generated/**,**/coverage/**

# Coverage report paths (lcov.info from Jest and Vitest)
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
